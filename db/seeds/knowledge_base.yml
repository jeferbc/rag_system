# Base de conocimiento sintética de "Calma Therapy Center", una clínica FICTICIA.
# Todas las personas, direcciones y datos de este archivo son inventados para
# demos y pruebas. Nunca pongas contenido real de una clínica aquí: cada
# despliegue real sube sus propios documentos de forma privada.
#
# No hay precios ni disponibilidad a propósito. Son datos vivos que se
# consultan con herramientas en tiempo real y nunca deben embeberse.
#
# El contenido está en español porque es el idioma en que escriben los
# pacientes; la recuperación funciona mejor cuando pregunta y documento
# comparten idioma.

# --- Psicólogos ---------------------------------------------------------

- id: psychologist-101-elena-marsh
  title: Elena Marsh, psicóloga clínica
  category: psychologist
  psychologist_ref: psy-101-elena-marsh
  body: |
    Elena Marsh es psicóloga clínica en Calma Therapy Center, con doce años de experiencia acompañando a adultos que viven con ansiedad.

    Especialidades: ansiedad generalizada, ataques de pánico, ansiedad por la salud, fobias y preocupación constante. También trabaja el insomnio causado por pensamientos ansiosos.

    Enfoque: Elena practica la terapia cognitivo-conductual (TCC). Las sesiones son estructuradas y prácticas: juntos identifican qué dispara la ansiedad, ponen a prueba las predicciones ansiosas paso a paso y practican habilidades entre sesiones. Añade técnicas de mindfulness para quienes les cuesta desconectar.

    Idiomas: Elena ofrece terapia en español y en inglés.

    Atiende a: adultos mayores de 18 años, de forma presencial y en línea.

- id: psychologist-102-tomas-rivera
  title: Tomás Rivera, psicólogo clínico
  category: psychologist
  psychologist_ref: psy-102-tomas-rivera
  body: |
    Tomás Rivera es psicólogo clínico en Calma Therapy Center y acompaña a adultos que atraviesan depresión, duelo y grandes cambios de vida.

    Especialidades: depresión, estado de ánimo bajo, duelo y pérdidas, soledad, y adaptación a cambios como la migración, el divorcio o la jubilación.

    Enfoque: Tomás combina la activación conductual con la terapia de aceptación y compromiso (ACT). Ayuda a reconstruir rutinas diarias que devuelven energía y a aclarar qué es importante para cada persona, para que las pequeñas acciones sumen. Su estilo es cálido y sin prisas.

    Idiomas: Tomás ofrece terapia en español y en inglés.

    Atiende a: adultos y adultos mayores, de forma presencial y en línea.

- id: psychologist-103-priya-nair
  title: Priya Nair, psicóloga especialista en trauma
  category: psychologist
  psychologist_ref: psy-103-priya-nair
  body: |
    Priya Nair es psicóloga en Calma Therapy Center, especializada en trauma y en sus efectos a largo plazo.

    Especialidades: estrés postraumático (TEPT), trauma en la infancia, accidentes y trauma médico, pesadillas y flashbacks, y disociación relacionada con el trauma.

    Enfoque: Priya está formada en EMDR (desensibilización y reprocesamiento por movimientos oculares) y en TCC centrada en el trauma. Las primeras sesiones se dedican a la seguridad y la estabilización; el procesamiento de los recuerdos solo empieza cuando la persona se siente preparada y tiene herramientas para mantenerse en calma.

    Idiomas: Priya ofrece terapia en inglés y en hindi. No ofrece sesiones en español.

    Atiende a: adultos mayores de 18 años, de forma presencial y en línea.

- id: psychologist-104-jonas-weber
  title: Jonas Weber, terapeuta de pareja
  category: psychologist
  psychologist_ref: psy-104-jonas-weber
  body: |
    Jonas Weber es psicólogo y terapeuta de pareja en Calma Therapy Center.

    Especialidades: terapia de pareja, problemas de comunicación, conflictos repetidos, reconstrucción de la confianza tras una infidelidad, dificultades en la intimidad, y la decisión de seguir juntos o separarse.

    Enfoque: Jonas trabaja con la terapia focalizada en las emociones (TFE) y el método Gottman. Las sesiones frenan las discusiones que se repiten para que cada miembro de la pareja pueda decir lo que hay debajo. Atiende a la pareja junta y puede ofrecer una sesión individual a cada uno al inicio.

    Idiomas: Jonas ofrece terapia en español, en inglés y en alemán.

    Atiende a: parejas de cualquier orientación y personas con dificultades de pareja. Presencial y en línea.

- id: psychologist-105-camila-duarte
  title: Camila Duarte, psicóloga infantil y de adolescentes
  category: psychologist
  psychologist_ref: psy-105-camila-duarte
  body: |
    Camila Duarte es psicóloga infantil y de adolescentes en Calma Therapy Center.

    Especialidades: ansiedad y miedos en la infancia, rechazo escolar, dificultades de conducta, regulación emocional, acoso escolar, y acompañamiento a niños ante una separación o una pérdida en la familia.

    Enfoque: con los más pequeños Camila usa terapia de juego; con adolescentes, TCC adaptada a su edad. Los padres forman parte del proceso: mantiene sesiones periódicas con ellos y da pautas concretas para casa y para el colegio.

    Idiomas: Camila ofrece terapia en español y en portugués. No ofrece sesiones en inglés.

    Atiende a: niños desde los 5 años y adolescentes hasta los 17, de forma presencial. Las sesiones en línea están disponibles para adolescentes y para la orientación a padres.

- id: psychologist-106-hannah-okoye
  title: Hannah Okoye, psicóloga perinatal
  category: psychologist
  psychologist_ref: psy-106-hannah-okoye
  body: |
    Hannah Okoye es psicóloga en Calma Therapy Center, centrada en la salud mental durante el embarazo y la primera etapa de la crianza.

    Especialidades: depresión posparto, ansiedad durante el embarazo y tras el parto, parto traumático, pérdida gestacional, estrés relacionado con la fertilidad, y el cambio de identidad que supone ser madre o padre.

    Enfoque: Hannah integra la terapia interpersonal (TIP) con la terapia centrada en la compasión. Presta atención al sueño, a la red de apoyo y a la relación de pareja, y se coordina con matronas o médicos cuando la persona lo pide.

    Idiomas: Hannah ofrece terapia en español y en inglés.

    Atiende a: adultos que esperan un bebé, madres y padres recientes y sus parejas. Presencial y en línea; los bebés son bienvenidos en la sesión.

- id: psychologist-107-mateo-fuentes
  title: Mateo Fuentes, psicólogo especialista en adicciones
  category: psychologist
  psychologist_ref: psy-107-mateo-fuentes
  body: |
    Mateo Fuentes es psicólogo en Calma Therapy Center y trabaja con adicciones y conductas compulsivas.

    Especialidades: consumo de alcohol y otras sustancias, juego, uso compulsivo de pantallas y videojuegos, prevención de recaídas, y apoyo a familiares.

    Enfoque: Mateo utiliza la entrevista motivacional y la TCC para la prevención de recaídas. Parte de las propias razones de cada persona para cambiar, sin juicios, y construye un plan concreto para las situaciones de riesgo. Se coordina con servicios médicos cuando hace falta desintoxicación o medicación.

    Idiomas: Mateo ofrece terapia únicamente en español.

    Atiende a: adultos mayores de 18 años y sus familias, de forma presencial y en línea.

- id: psychologist-108-sofia-lindqvist
  title: Sofia Lindqvist, psicóloga especialista en trastornos alimentarios
  category: psychologist
  psychologist_ref: psy-108-sofia-lindqvist
  body: |
    Sofia Lindqvist es psicóloga en Calma Therapy Center, especializada en trastornos de la conducta alimentaria e imagen corporal.

    Especialidades: anorexia, bulimia, trastorno por atracón, alimentación emocional, malestar con la imagen corporal y perfeccionismo.

    Enfoque: Sofia practica la TCC mejorada para trastornos alimentarios (TCC-E) y, con adolescentes, el tratamiento basado en la familia. Trabaja junto al médico y al nutricionista de cada persona, porque la recuperación necesita seguimiento médico y nutricional además de terapia.

    Idiomas: Sofia ofrece terapia en español, en inglés y en sueco.

    Atiende a: adolescentes desde los 14 años y adultos, de forma presencial y en línea.

- id: psychologist-109-david-chen
  title: David Chen, psicólogo especialista en TDAH en adultos
  category: psychologist
  psychologist_ref: psy-109-david-chen
  body: |
    David Chen es psicólogo en Calma Therapy Center y trabaja con adultos con TDAH y otras dificultades de atención.

    Especialidades: TDAH en adultos, procrastinación, desorganización, gestión del tiempo, impulsividad emocional, y la baja autoestima que suele dejar años de sentirse "vago" o "desordenado".

    Enfoque: David ofrece TCC adaptada al TDAH junto con acompañamiento práctico en funciones ejecutivas. De las sesiones salen sistemas que la persona realmente usa: recordatorios externos, división de tareas y rutinas diseñadas según cómo funciona su atención.

    Idiomas: David ofrece terapia en español, en inglés y en mandarín.

    Atiende a: adultos y estudiantes universitarios, de forma presencial y en línea. Realiza evaluación psicológica del TDAH; no prescribe medicación.

- id: psychologist-110-lucia-paredes
  title: Lucía Paredes, psicóloga especialista en TOC y ansiedad social
  category: psychologist
  psychologist_ref: psy-110-lucia-paredes
  body: |
    Lucía Paredes es psicóloga en Calma Therapy Center, especializada en trastorno obsesivo-compulsivo y ansiedad social.

    Especialidades: TOC, pensamientos intrusivos, comprobaciones y limpieza compulsivas, ansiedad social, miedo a hablar en público, y timidez que limita el trabajo o los estudios.

    Enfoque: Lucía utiliza la exposición con prevención de respuesta (EPR), el tratamiento de referencia para el TOC, y la TCC para la ansiedad social. La exposición es siempre gradual y acordada de antemano: la persona marca el ritmo.

    Idiomas: Lucía ofrece terapia únicamente en español.

    Atiende a: adolescentes desde los 16 años y adultos, de forma presencial y en línea.

- id: psychologist-111-amara-bello
  title: Amara Bello, psicóloga especialista en estrés y burnout
  category: psychologist
  psychologist_ref: psy-111-amara-bello
  body: |
    Amara Bello es psicóloga en Calma Therapy Center y ayuda a personas con estrés laboral y burnout.

    Especialidades: burnout, estrés crónico, ansiedad relacionada con el trabajo, perfeccionismo, síndrome del impostor, y dificultad para poner límites entre el trabajo y la vida personal.

    Enfoque: Amara combina la reducción del estrés basada en mindfulness (MBSR) con ACT. Ayuda a reconocer las primeras señales de agotamiento, a recuperarse y, después, a cambiar los patrones que llevaron hasta ahí, incluida la forma de negociar la carga de trabajo y de decir que no.

    Idiomas: Amara ofrece terapia en español, en inglés y en francés.

    Atiende a: adultos, de forma presencial y en línea.

- id: psychologist-112-noah-feldman
  title: Noah Feldman, psicólogo con enfoque afirmativo LGBTQ+
  category: psychologist
  psychologist_ref: psy-112-noah-feldman
  body: |
    Noah Feldman es psicólogo en Calma Therapy Center y ofrece terapia afirmativa para personas LGBTQ+.

    Especialidades: orientación sexual e identidad de género, salida del armario, estrés de minoría, aceptación familiar, autoestima, y dificultades de pareja en parejas LGBTQ+.

    Enfoque: Noah trabaja desde una postura centrada en la persona y afirmativa, con herramientas de la TCC y de la terapia narrativa. Nadie tiene que explicar ni justificar quién es; la terapia se centra en lo que la persona quiere cambiar o entender.

    Idiomas: Noah ofrece terapia en español y en inglés.

    Atiende a: adolescentes desde los 15 años y adultos, de forma presencial y en línea.

# --- Preguntas frecuentes -------------------------------------------------

- id: faq-booking-first-appointment
  title: "Preguntas frecuentes: ¿Cómo reservo una primera cita?"
  category: faq
  body: |
    Puedes reservar una primera cita en Calma Therapy Center a través de este asistente, por teléfono o en recepción.

    Para reservar necesitamos tu nombre, un teléfono o correo de contacto, si prefieres sesiones presenciales o en línea, y el idioma en el que quieres hacer terapia. Si ya sabes con qué psicólogo o psicóloga quieres ir, dínoslo; si no, te sugeriremos a alguien según lo que buscas.

    Los horarios disponibles cambian constantemente, así que siempre se consultan en vivo en el momento de reservar. Recibirás un mensaje de confirmación con la fecha, la hora y el formato de la sesión.

- id: faq-first-session
  title: "Preguntas frecuentes: ¿Qué pasa en la primera sesión?"
  category: faq
  body: |
    La primera sesión es una conversación para conocerte y entender qué te trae a terapia. No es un examen y no hay respuestas incorrectas.

    Tu psicólogo o psicóloga te preguntará por lo que estás viviendo, desde cuándo, por tu salud y tu día a día, y por lo que te gustaría que fuera diferente. Tú también puedes preguntar lo que quieras sobre cómo trabaja.

    Al final, te compartirá una primera impresión y te propondrá un plan: con qué frecuencia veros y cuáles podrían ser los primeros objetivos. Tú decides si continuar. Si sientes que no encajas, te ayudaremos a encontrar a otro profesional del equipo.

- id: faq-online-sessions
  title: "Preguntas frecuentes: ¿Ofrecen sesiones en línea?"
  category: faq
  body: |
    Sí. La mayoría de los psicólogos de Calma Therapy Center ofrecen sesiones en línea por videollamada segura, y la investigación muestra que son tan eficaces como la terapia presencial para la mayoría de los problemas.

    Necesitas un espacio privado, una conexión a internet estable y un teléfono, tableta o computador con cámara. Recibirás un enlace antes de cada sesión; no hay que instalar nada.

    Puedes combinar ambos formatos, por ejemplo presencial la mayoría de las semanas y en línea cuando viajes. La terapia con niños pequeños se ofrece solo de forma presencial.

- id: faq-session-length-frequency
  title: "Preguntas frecuentes: ¿Cuánto dura una sesión y con qué frecuencia vendré?"
  category: faq
  body: |
    Las sesiones individuales duran 50 minutos. Las sesiones de pareja y de familia duran 75 minutos.

    La mayoría de las personas empiezan con una sesión por semana. A medida que las cosas mejoran, las sesiones suelen espaciarse a cada dos semanas y después a una al mes antes de terminar.

    La duración de la terapia depende de tus objetivos. Algunas personas vienen unos meses para trabajar un problema concreto; otras eligen un proceso más largo. Tu psicólogo o psicóloga revisará contigo los avances con regularidad, para que siempre sepas en qué punto estás.

- id: faq-choosing-a-psychologist
  title: "Preguntas frecuentes: ¿Cómo elijo al psicólogo adecuado?"
  category: faq
  body: |
    Parte de aquello en lo que quieres ayuda y del idioma en el que quieres hablar. Cada psicólogo de Calma Therapy Center tiene un perfil que describe sus especialidades, su enfoque y los idiomas en los que trabaja.

    Si no estás seguro, describe tu situación en unas frases y te sugeriremos uno o dos profesionales cuya experiencia encaje. Por ejemplo, tenemos psicólogos centrados en ansiedad, depresión y duelo, trauma, pareja, niños y adolescentes, salud mental perinatal, adicciones, trastornos alimentarios, TDAH en adultos, TOC, burnout y terapia afirmativa LGBTQ+.

    La relación con tu terapeuta importa tanto como el método. Si después de unas sesiones no te sientes a gusto, puedes cambiar en cualquier momento.

- id: faq-confidentiality
  title: "Preguntas frecuentes: ¿Lo que cuento en terapia es confidencial?"
  category: faq
  body: |
    Sí. Todo lo que hables con tu psicólogo o psicóloga es confidencial y está protegido por el secreto profesional. No compartimos información con tu familia, tu empleador ni nadie más sin tu consentimiento por escrito.

    Hay unas pocas excepciones legales: cuando existe un riesgo grave e inminente para tu vida o la de otra persona, cuando un menor o una persona vulnerable está sufriendo daño, o cuando lo ordena un juez. Tu psicólogo te explicará estos límites en la primera sesión.

    Consulta nuestra política de privacidad y confidencialidad para saber cómo se guardan los registros.

- id: faq-children-and-teenagers
  title: "Preguntas frecuentes: ¿Atienden a niños y adolescentes?"
  category: faq
  body: |
    Sí. Calma Therapy Center cuenta con psicólogos especializados en niños desde los 5 años y en adolescentes.

    Con los niños, la primera cita suele ser solo con los padres o tutores, para entender la situación. Después el psicólogo conoce al niño, y los padres participan durante todo el proceso con sesiones periódicas de orientación.

    A los adolescentes se les suele atender a solas, con alguna sesión familiar ocasional. Lo que cuenta un adolescente en sesión es confidencial, con las excepciones de seguridad que el psicólogo explica al inicio tanto al adolescente como a los padres.

    Un padre, madre o tutor legal debe dar su consentimiento antes de empezar la terapia con un menor.

- id: faq-couples-and-family-therapy
  title: "Preguntas frecuentes: ¿Ofrecen terapia de pareja y de familia?"
  category: faq
  body: |
    Sí. En Calma Therapy Center ofrecemos terapia de pareja y terapia familiar.

    La terapia de pareja es para parejas que quieren mejorar la comunicación, salir de discusiones repetidas, reconstruir la confianza o tomar una decisión sobre la relación. Ambos miembros asisten juntos.

    La terapia familiar ayuda cuando una dificultad afecta a toda la casa, como un conflicto con un adolescente, una separación o una enfermedad en la familia.

    El terapeuta no toma partido. Su papel es ayudar a que todos sean escuchados y a encontrar nuevas formas de relacionarse.

- id: faq-languages
  title: "Preguntas frecuentes: ¿En qué idiomas se ofrecen las sesiones?"
  category: faq
  body: |
    En Calma Therapy Center la terapia está disponible en español con la mayoría de los psicólogos y en inglés con varios de ellos. Según el profesional, también se ofrecen sesiones en portugués, francés, alemán, sueco, hindi y mandarín.

    El perfil de cada psicólogo indica los idiomas en los que trabaja. La terapia funciona mejor en el idioma en el que te sientes más cómodo expresando emociones, así que dinos tu preferencia al reservar.

    Nuestra recepción y este asistente pueden atenderte en español y en inglés.

- id: faq-switching-psychologist
  title: "Preguntas frecuentes: ¿Puedo cambiar de psicólogo?"
  category: faq
  body: |
    Sí, en cualquier momento y sin tener que justificarlo. Sentirte a gusto con tu terapeuta es esencial para que la terapia funcione.

    Puedes decírselo directamente a tu psicólogo actual, o pedirlo en recepción o a este asistente. Te sugeriremos a otro profesional que encaje con lo que necesitas.

    Con tu permiso, tu nuevo psicólogo puede recibir un breve resumen del anterior para que no tengas que empezar de cero.

- id: faq-medication
  title: "Preguntas frecuentes: ¿Recetan medicación?"
  category: faq
  body: |
    No. Los profesionales de Calma Therapy Center son psicólogos, y los psicólogos no recetan medicación. Ofrecemos evaluación psicológica y psicoterapia.

    Si tu psicólogo considera que la medicación podría ayudarte, te recomendará una consulta con un psiquiatra o con tu médico de cabecera y, con tu consentimiento, se coordinará con ellos.

    Si ya tomas medicación psiquiátrica, puedes empezar terapia con normalidad. Por favor, no dejes ni cambies la medicación sin hablar con el médico que te la recetó.

- id: faq-crisis-and-emergencies
  title: "Preguntas frecuentes: ¿Qué hago en una crisis o una emergencia?"
  category: faq
  body: |
    Calma Therapy Center no es un servicio de emergencias. Si tú u otra persona están en peligro inmediato, o estás pensando en hacerte daño, llama ahora mismo al número de emergencias de tu zona o acude al servicio de urgencias del hospital más cercano.

    Este asistente no puede atender emergencias y los mensajes no se revisan las 24 horas.

    Si ya eres paciente y estás pasando por un momento difícil que no es una emergencia, contacta con recepción en horario de atención y avisaremos a tu psicólogo para que se ponga en contacto contigo.

# --- Políticas --------------------------------------------------------------

- id: policy-cancellation-and-rescheduling
  title: Política de cancelación y cambios de cita
  category: policy
  body: |
    La hora de tu sesión está reservada exclusivamente para ti. Si no puedes asistir, avísanos con la mayor antelación posible para que ese horario pueda ofrecerse a otra persona.

    Puedes cancelar o cambiar tu cita sin coste hasta 24 horas antes del inicio de la sesión. Puedes hacerlo a través de este asistente, por teléfono o en recepción.

    Las cancelaciones con menos de 24 horas de antelación y las sesiones a las que no se asiste sin avisar se cobran al importe completo de la sesión. Se hacen excepciones por emergencias médicas y otros imprevistos graves; habla con recepción.

    Si es tu psicólogo quien tiene que cancelar, se te ofrecerá un nuevo horario y no se te cobrará nada.

- id: policy-payment
  title: Política de pago
  category: policy
  body: |
    El pago se realiza el mismo día de cada sesión. En las sesiones en línea, el pago se hace antes de empezar mediante el enlace seguro que se envía con la confirmación.

    Aceptamos tarjeta de débito y de crédito, transferencia bancaria y pago sin contacto en recepción. No aceptamos efectivo para las sesiones en línea.

    Recibirás un recibo detallado de cada pago. Muchos seguros de salud reembolsan parte de la psicoterapia; podemos emitir los documentos que tu aseguradora pida, pero el reembolso se gestiona entre tú y tu aseguradora.

    Las tarifas dependen del tipo de sesión y se confirman al reservar. Pregunta a este asistente o en recepción por las tarifas vigentes en cualquier momento.

    Si estás pasando por dificultades económicas, coméntalo con tu psicólogo o en recepción antes de que se acumule un saldo pendiente, para buscar opciones juntos.

- id: policy-late-arrival-and-missed-sessions
  title: Política de retrasos y sesiones no asistidas
  category: policy
  body: |
    Las sesiones empiezan y terminan a la hora programada. Si llegas tarde, la sesión termina igualmente a la hora prevista, porque hay otra persona citada después, y se cobra completa.

    Si llegas con más de 20 minutos de retraso sin avisar, la sesión se considera no asistida y se aplica la política de cancelación.

    Si es tu psicólogo quien va con retraso, recibirás el tiempo completo de tu sesión o se compensará la diferencia en una sesión posterior.

    Tras dos sesiones consecutivas no asistidas sin aviso, es posible que liberemos tu horario habitual. Siempre serás bienvenido para volver a reservar.

- id: policy-privacy-and-confidentiality
  title: Política de privacidad y confidencialidad
  category: policy
  body: |
    Calma Therapy Center trata toda la información personal y de salud como estrictamente confidencial.

    Qué guardamos: datos de contacto, historial de citas, registros de pago y las notas clínicas que escribe tu psicólogo. Las notas clínicas solo puede leerlas tu psicólogo.

    Cómo la protegemos: los registros se guardan en un sistema de historia clínica cifrado con controles de acceso individuales. Los documentos en papel se guardan en archivadores cerrados con llave.

    Con quién la compartimos: nunca compartimos tu información con terceros sin tu consentimiento por escrito, salvo cuando la ley lo exige, como ante un riesgo grave e inminente para la seguridad de alguien o una orden judicial.

    Tus derechos: puedes pedir ver tus registros, corregirlos o solicitar un informe para otro profesional. Las solicitudes se hacen por escrito en recepción.

    Las conversaciones con este asistente se usan para ayudarte con tu solicitud. Por favor, no compartas información clínica detallada en el chat; guárdala para tus sesiones.

- id: policy-online-sessions
  title: Política de sesiones en línea
  category: policy
  body: |
    Las sesiones en línea de Calma Therapy Center se realizan por videollamada segura y cifrada. La clínica nunca graba las sesiones, y los pacientes tampoco pueden grabarlas.

    Por favor, conéctate desde un lugar privado y tranquilo donde no te interrumpan, y nunca mientras conduces. Usa auriculares si hay otras personas cerca. Tu psicólogo también estará en una sala privada.

    Si la conexión falla, tu psicólogo intentará reconectar y después te llamará por teléfono para continuar o acordar una nueva hora. El tiempo perdido por problemas técnicos de nuestra parte se compensa.

    Las sesiones en línea siguen las mismas políticas de cancelación y pago que las presenciales. Por seguridad, te pediremos confirmar la dirección desde la que te conectas al inicio de cada sesión.

- id: policy-minors-and-guardian-consent
  title: Política de menores y consentimiento de tutores
  category: policy
  body: |
    La terapia con cualquier persona menor de 18 años requiere el consentimiento por escrito de un padre, madre o tutor legal antes de la primera sesión. Cuando los padres están separados y comparten la custodia, pedimos el consentimiento de ambos.

    Un padre, madre o tutor debe estar localizable durante la sesión de un niño menor de 12 años y debe permanecer en la sala de espera durante las sesiones presenciales.

    Lo que un niño o adolescente cuenta en terapia es confidencial. Los padres reciben información periódica sobre los objetivos y los avances, pero no los detalles de cada sesión. El psicólogo siempre informará a los padres si existe un riesgo para la seguridad del menor.

    Las citas, cancelaciones y pagos de los menores los gestiona el padre, madre o tutor.
