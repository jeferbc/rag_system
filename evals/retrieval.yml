# Retrieval eval set: questions a patient might send, and the seed document(s)
# that should come back for each. Run with `bin/rails evals:retrieval`.
#
# - question: written the way people message a clinic (informal, missing
#   accents, abbreviations), never copied from the document's wording.
# - expected: source_ids from db/seeds/knowledge_base.yml. Any one of them in
#   the top K counts as a hit. Empty means the knowledge base has no answer:
#   the question is not scored, only reported with its nearest distance.
# - tags: used to break the report down. One category tag (psychologist, faq,
#   policy) plus difficulty tags (language, multi, crisis, english) or, for
#   unscored questions, the reason (live_data, not_covered, off_topic).
#
# All content is synthetic, like the seeds. Do not add real patient messages.

